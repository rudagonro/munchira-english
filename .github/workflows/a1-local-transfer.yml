name: Incorporar A1 local verificado
on:
  push:
    branches: [a1-repo-local-progress]
permissions:
  contents: write
jobs:
  transfer:
    if: github.ref == 'refs/heads/a1-repo-local-progress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Descargar paquete de transferencia única
        run: |
          curl --fail --location --silent --show-error 'https://munchira-english.lovable.app/__l5e/assets-v1/b6f60136-9883-4c3f-b93a-baf50d2b8573/a1-repository-transfer.zip' -o "$RUNNER_TEMP/a1-transfer.zip"
          echo "5ef58287347085b8ce5a13f5ceefe40044f60ea9736a670279e7fd4da045d22f  $RUNNER_TEMP/a1-transfer.zip" | sha256sum --check
      - name: Extraer solo archivos revisados y verificar todos los bytes
        run: |
          python3 - <<'PY'
          import os,json,hashlib,zipfile,pathlib
          root=pathlib.Path.cwd()
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'a1-transfer.zip') as z:
            manifest=json.loads(z.read('transfer-manifest.json'))
            assert set(z.namelist())=={'transfer-manifest.json'}|{f['path'] for f in manifest['files']}
            for file in manifest['files']:
              path=pathlib.PurePosixPath(file['path'])
              assert not path.is_absolute() and not any(part in ['..','.git','.env','node_modules','dist'] for part in path.parts)
              data=z.read(file['path']);assert hashlib.sha256(data).hexdigest()==file['sha256'];assert len(data)==file['size']
              output=root/file['path'];output.parent.mkdir(parents=True,exist_ok=True);output.write_bytes(data)
            assert set(manifest['deleted'])=={'src/data/modelLessons/a1-audio-pointers.json.asset.json','src/data/modelLessons/a1-units.json.asset.json'}
            for name in manifest['deleted']:(root/name).unlink()
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'a1-manifest.json').write_text(json.dumps(manifest))
          print('92 archivos revisados; dos punteros antiguos retirados')
          PY
      - run: npm ci
      - run: npm run content:validate
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build-placeholder-public-key
      - name: Incorporar archivos a la misma rama y retirar esta automatización temporal
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'); const path = require('path'); const crypto = require('crypto');
            const manifest = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'a1-manifest.json'), 'utf8'));
            const owner = context.repo.owner; const repo = context.repo.repo; const ref = 'heads/a1-repo-local-progress';
            const head = await github.rest.git.getRef({owner,repo,ref});
            if (head.data.object.sha !== context.sha) throw new Error('La rama cambió durante la transferencia; no sobrescribir');
            const base = await github.rest.git.getCommit({owner,repo,commit_sha:context.sha});
            const entries = []; let next = 0;
            const lane = async () => {
              while (next < manifest.files.length) {
                const file = manifest.files[next++]; const bytes = fs.readFileSync(file.path);
                if (crypto.createHash('sha256').update(bytes).digest('hex') !== file.sha256) throw new Error('Archivo modificado tras revisión: '+file.path);
                const blob = await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'});
                entries.push({path:file.path,mode:'100644',type:'blob',sha:blob.data.sha});
              }
            };
            await Promise.all([lane(),lane(),lane(),lane()]);
            for (const deleted of [...manifest.deleted,'.github/workflows/a1-local-transfer.yml']) entries.push({path:deleted,mode:'100644',type:'blob',sha:null});
            const tree = await github.rest.git.createTree({owner,repo,base_tree:base.data.tree.sha,tree:entries});
            const commit = await github.rest.git.createCommit({owner,repo,message:'A1 local: contenido y 28 audios en el repo, progreso autenticado aditivo; retirar transferencia temporal',tree:tree.data.sha,parents:[context.sha]});
            await github.rest.git.updateRef({owner,repo,ref,sha:commit.data.sha,force:false});
            core.info('Entrega guardada en '+commit.data.sha+'; recursos locales, transferencia temporal retirada.');
